name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 可选：烧入桌面端 / Android 安装包的默认 API 地址
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  check:
    name: 质量检查
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter frontend typecheck
          pnpm --filter frontend test
          pnpm --filter frontend build
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      # ruff 暂不作为闸门：仓库存量约 79 处违规（集中在 mcp/、tests/ 的超长行），清理完成后再纳入
      - run: |
          uv run mypy app.py workbench api identity progress knowledge subscription ai_settings system shared pulse updater
          uv run pytest
        working-directory: backend

  docker:
    name: Docker 镜像
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build_meta
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            WORKBENCH_GIT_SHA=${{ github.sha }}
            WORKBENCH_BUILT_AT=${{ steps.build_meta.outputs.built_at }}

  server-bundle:
    name: 服务端离线更新包
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: bundle-output
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=server-dist
          cache-from: type=gha,scope=bundle-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bundle-${{ matrix.arch }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            WORKBENCH_GIT_SHA=${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: server-dist/*
          retention-days: 3

  server-publish:
    name: 发布服务端更新频道
    runs-on: ubuntu-latest
    needs: [server-bundle, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: server-dist
          merge-multiple: true
      - run: bash deploy/publish-server-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: 桌面端（macOS）
    runs-on: macos-latest
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url || 'https://workbench.reelab.cc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: pnpm install --frozen-lockfile
      - id: desktop_meta
        run: |
          SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          BASE="$(python3 -c "import json; print(json.load(open('frontend/src-tauri/tauri.conf.json'))['version'].split('+')[0])")"
          VERSION="${BASE}+${SHORT}"
          python3 -c "
          import json, re
          from pathlib import Path
          version = '${VERSION}'
          path = Path('frontend/src-tauri/tauri.conf.json')
          data = json.loads(path.read_text())
          data['version'] = version
          path.write_text(json.dumps(data, indent=2) + chr(10))
          cargo = Path('frontend/src-tauri/Cargo.toml')
          text = re.sub(r'(?m)^version = \"[^\"]+\"', f'version = \"{version}\"', cargo.read_text(), count=1)
          cargo.write_text(text)
          "
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"
      - run: pnpm tauri build
        working-directory: frontend
      - name: 固定 DMG 文件名
        run: |
          mkdir -p dist-dmg
          src="$(ls frontend/src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          cp "$src" dist-dmg/Workbench-macos-aarch64.dmg
          ls -lh dist-dmg/
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-macos
          path: dist-dmg/Workbench-macos-aarch64.dmg
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: desktop-latest
          name: Desktop ${{ steps.desktop_meta.outputs.version }}
          body: |
            滚动桌面端构建（prerelease）。
            - version: `${{ steps.desktop_meta.outputs.version }}`
            - commit: `${{ github.sha }}`
            - asset: `Workbench-macos-aarch64.dmg`

            设置页「版本更新 → 更新客户端」会拉取此 Release。
          prerelease: true
          make_latest: false
          files: dist-dmg/Workbench-macos-aarch64.dmg
          fail_on_unmatched_files: true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-dmg/Workbench-macos-aarch64.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true

  android:
    name: Android（APK）
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url || 'https://workbench.reelab.cc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # 不要装已废弃的 `tools`；cmdline-tools 由 action 自带
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.0.12077973'
      - name: 设置 NDK_HOME
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/gen/android/**/*.gradle*', 'frontend/src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - id: android_meta
        run: |
          SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          BASE="$(python3 -c "import json; print(json.load(open('frontend/src-tauri/tauri.conf.json'))['version'].split('+')[0])")"
          VERSION="${BASE}+${SHORT}"
          # versionCode 必须单调递增，否则无法覆盖安装；用 run_number 压过本地 1000 起算
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          python3 -c "
          import json, re
          from pathlib import Path
          version = '${VERSION}'
          version_code = ${VERSION_CODE}
          path = Path('frontend/src-tauri/tauri.conf.json')
          data = json.loads(path.read_text())
          data['version'] = version
          data.setdefault('bundle', {}).setdefault('android', {})['versionCode'] = version_code
          path.write_text(json.dumps(data, indent=2) + chr(10))
          cargo = Path('frontend/src-tauri/Cargo.toml')
          text = re.sub(r'(?m)^version = \"[^\"]+\"', f'version = \"{version}\"', cargo.read_text(), count=1)
          cargo.write_text(text)
          props = Path('frontend/src-tauri/gen/android/app/tauri.properties')
          props.write_text(
              '// THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.\\n'
              + f'tauri.android.versionName={version}\\n'
              + f'tauri.android.versionCode={version_code}\\n'
          )
          "
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"
      - run: pnpm tauri android build --apk --target aarch64
        working-directory: frontend
      - name: 固定 APK 文件名
        run: |
          mkdir -p dist-apk
          src="$(find frontend/src-tauri/gen/android/app/build/outputs/apk -path '*release*.apk' | head -1)"
          test -n "$src"
          cp "$src" dist-apk/Workbench-android-aarch64.apk
          ls -lh dist-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-android
          path: dist-apk/Workbench-android-aarch64.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: Android ${{ steps.android_meta.outputs.version }}
          body: |
            滚动 Android **release** 构建（prerelease）。
            - version: `${{ steps.android_meta.outputs.version }}`
            - versionCode: `${{ steps.android_meta.outputs.version_code }}`
            - commit: `${{ github.sha }}`
            - asset: `Workbench-android-aarch64.apk`
            - package: `com.workbench.desktop`（可覆盖安装）

            若本机曾装过 debug 包（`com.workbench.desktop.debug`），需先卸载再装本包。
            默认 API：`https://workbench.reelab.cc`
          prerelease: true
          make_latest: false
          files: dist-apk/Workbench-android-aarch64.apk
          fail_on_unmatched_files: true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-apk/Workbench-android-aarch64.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
