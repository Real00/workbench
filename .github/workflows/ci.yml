name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 可选：烧入桌面端安装包的默认 API 地址
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  check:
    name: 质量检查
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter frontend typecheck
          pnpm --filter frontend test
          pnpm --filter frontend build
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      # ruff 暂不作为闸门：仓库存量约 79 处违规（集中在 mcp/、tests/ 的超长行），清理完成后再纳入
      - run: |
          uv run mypy app.py workbench api identity progress ai_settings shared
          uv run pytest
        working-directory: backend

  docker:
    name: Docker 镜像
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org

  desktop:
    name: 桌面端（macOS）
    runs-on: macos-latest
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-macos
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
