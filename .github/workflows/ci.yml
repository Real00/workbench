name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 可选：烧入桌面端安装包的默认 API 地址
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  check:
    name: 质量检查
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter frontend typecheck
          pnpm --filter frontend test
          pnpm --filter frontend build
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      # ruff 暂不作为闸门：仓库存量约 79 处违规（集中在 mcp/、tests/ 的超长行），清理完成后再纳入
      - run: |
          uv run mypy app.py workbench api identity progress knowledge subscription ai_settings system shared pulse
          uv run pytest
        working-directory: backend

  docker:
    name: Docker 镜像
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build_meta
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            WORKBENCH_GIT_SHA=${{ github.sha }}
            WORKBENCH_BUILT_AT=${{ steps.build_meta.outputs.built_at }}

  desktop:
    name: 桌面端（macOS）
    runs-on: macos-latest
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: pnpm install --frozen-lockfile
      - id: desktop_meta
        run: |
          SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          BASE="$(python3 -c "import json; print(json.load(open('frontend/src-tauri/tauri.conf.json'))['version'].split('+')[0])")"
          VERSION="${BASE}+${SHORT}"
          python3 -c "
          import json, re
          from pathlib import Path
          version = '${VERSION}'
          path = Path('frontend/src-tauri/tauri.conf.json')
          data = json.loads(path.read_text())
          data['version'] = version
          path.write_text(json.dumps(data, indent=2) + chr(10))
          cargo = Path('frontend/src-tauri/Cargo.toml')
          text = re.sub(r'(?m)^version = \"[^\"]+\"', f'version = \"{version}\"', cargo.read_text(), count=1)
          cargo.write_text(text)
          "
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"
      - run: pnpm tauri build
        working-directory: frontend
      - name: 固定 DMG 文件名
        run: |
          mkdir -p dist-dmg
          src="$(ls frontend/src-tauri/target/release/bundle/dmg/*.dmg | head -1)"
          cp "$src" dist-dmg/Workbench-macos-aarch64.dmg
          ls -lh dist-dmg/
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-macos
          path: dist-dmg/Workbench-macos-aarch64.dmg
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: desktop-latest
          name: Desktop ${{ steps.desktop_meta.outputs.version }}
          body: |
            滚动桌面端构建（prerelease）。
            - version: `${{ steps.desktop_meta.outputs.version }}`
            - commit: `${{ github.sha }}`
            - asset: `Workbench-macos-aarch64.dmg`

            设置页「版本更新 → 更新客户端」会拉取此 Release。
          prerelease: true
          make_latest: false
          files: dist-dmg/Workbench-macos-aarch64.dmg
          fail_on_unmatched_files: true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-dmg/Workbench-macos-aarch64.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
