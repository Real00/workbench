# 生产示例：从 GHCR 拉镜像（非本地 build）。
# 用法：docker compose -f compose.ghcr.yaml up -d

services:
  app:
    image: ghcr.io/real00/workbench:latest
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - path: .env
        required: false
    environment:
      WORKBENCH_MONGO_URI: mongodb://mongo:27017
      WORKBENCH_MONGO_DATABASE: workbench
      WORKBENCH_UPLOAD_DIR: /app/data/uploads
      WORKBENCH_UPDATE_GITHUB_REPO: ${WORKBENCH_UPDATE_GITHUB_REPO:-real00/workbench}
      WORKBENCH_UPDATE_GITHUB_TOKEN: ${WORKBENCH_UPDATE_GITHUB_TOKEN:-}
    volumes:
      - app-uploads:/app/data/uploads
      - app-knowledge:/app/data/knowledge
      - app-releases:/app/data/releases
    ports:
      - "${WORKBENCH_PORT:-8080}:8080"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mongo-data:
  app-uploads:
  app-knowledge:
  app-releases:
