[project]
name = "console-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "openai>=1.50",
  "pydantic>=2.9",
  "pydantic-ai-slim[openai]>=2.37.0",
  "pydantic-settings>=2.5",
  "PyJWT>=2.9",
  "pymongo>=4.9",
  "python-docx>=1.1",
]

[dependency-groups]
dev = [
  "mypy>=2.3.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "watchfiles>=1.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
exclude = ["\\.venv/", "tests/"]
check_untyped_defs = true
